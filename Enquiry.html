<body>
     <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">Siyakhana Legal Advice Centre</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>

                <a href="contactus.html">Contact Us</a>

<!-- Personal Details Fieldset -->
<fieldset>
<legend><strong>Your Personal Information</strong></legend>
<br>
                   
<label for="fullname">Full Name:</label><br>
<input type="text" id="fullname" name="fullname" placeholder="e.g. Kubobonke Diko" required><br><br>
<label for="email">Email Address:</label><br>
<input type="email" id="email" name="email" placeholder="e.g. kubobonkediko@example.com" required><br><br>

<label for="phone">Phone / WhatsApp Number:</label><br>
<input type="tel" id="phone" name="phone" placeholder="e.g. 072 763 3457"><br><br>

<label for="location">Suburban Area in Mount Frere:</label><br>
<input type="text" id="location" name="location" placeholder="e.g. Siyakhana legal advice centre, Mount Frere"><br><br>
</fieldset>

<br>

<!-- Enquiry Category Fieldset -->
<fieldset>
<legend><strong>Enquiry & Consultation booking</strong></legend>
<br>

<label for="category">Enquiry Category:</label><br>
<select id="category" name="category" required>
<option value="" disabled selected>-- Select an Enquiry Type --</option>
<option value="booking">One on One consultation services</option>
<option value="Service Quotation ">Services Quotation fee</option>
<option value="general">General Enquiry</option>
</select><br><br>

<label>Preferred Availability for :</label><br>
<input type="checkbox" id="avail_Wednesday" name="availability[]" value="Wednesday">
<label for="avail_Wednesday">Wednesday </label><br>
                   
<input type="checkbox" id="avail_weekdays" name="availability[]" value="Weekdays">
<label for="avail_weekdays">Weekdays</label><br><br>

<label for="message"> Specific Request:</label><br>
<textarea id="message" name="message" rows="6" cols="50" placeholder="Please tell us more about your enquiry or how you'd like to get involved..." required></textarea><br><br>
</fieldset>

<br>

<style>
    body{
    background-color:beige;
}

</style>

               
</form>
</section>
</main>
